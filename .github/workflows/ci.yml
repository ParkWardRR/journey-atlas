name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  trips:
    name: Validate & lint trips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Every trip must compile against schema/journey.schema.json …
      - name: Schema-validate every trip
        run: |
          shopt -s nullglob
          for f in trips/*.yaml trips/*.json; do
            echo "· $f"
            node scripts/build-trip.mjs "$f"
          done
      # … and pass the plausibility checks (fails only on hard ERRORs).
      - name: Trip-doctor plausibility lint
        run: |
          shopt -s nullglob
          files=(trips/*.yaml trips/*.json)
          node scripts/trip-doctor.mjs "${files[@]}"

  build:
    name: Static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
