name: CI (self-hosted · OrbStack on Mac mini)

# Runs on our own Mac mini via a self-hosted runner — never on GitHub-hosted
# runners. Because this repo is PUBLIC, we deliberately do NOT run on fork
# pull_requests (which could execute untrusted code on the runner): validation
# happens by pushing branches. See ci/setup-self-hosted-runner.sh.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# One self-hosted job that hands the whole pipeline to OrbStack: lint, unit
# tests, static build and the Go byte-parity check all run inside the
# reproducible ci/Dockerfile image (Deno + Go + Zig + Chromium + ffmpeg).
jobs:
  ci:
    name: Pipeline in OrbStack
    runs-on: [self-hosted, macos, orbstack]
    steps:
      - uses: actions/checkout@v4
      - name: Lint · tests · build · Go byte-parity (OrbStack)
        run: bash ci/orb-ci.sh check
